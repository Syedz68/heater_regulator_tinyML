[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heater-regulator-tinyml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
